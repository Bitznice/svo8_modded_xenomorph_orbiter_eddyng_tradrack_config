[gcode_macro PRINT_START]
gcode:
  #START_TONES
  # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  #SET_DISPLAY_TEXT MSG="Homing axes."  # Displays info
  #STATUS_HOMING
  LCD_CYAN
  G28                   # Full home (XYZ)
  G90                   # Absolut position
  
  # Checks if the bed temp is higher than 75c - if so then trigger a heatsoak.
  {% if params.BED|int > 79 %}
    SET_DISPLAY_TEXT MSG="Heating bed..."           # Displays info
    LCD_RED
    M106 S255                                           # Turns on the PT-fan

    G1 X175 Y175 Z15 F9000                    # Goes to center of the bed
    M190 S{target_bed}                                  # Sets the target temp for the bed
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_bed}c for 20 mins.."  # Displays info
    G4 P1200000    # Waits 20 min in order to soak the bed

  # If the bed temp is not over 75c, then it skips the heatsoak and just heats up to set temp with a 5min soak
  {% else %}
    SET_DISPLAY_TEXT MSG="Heating bed..."           # Displays info
    LCD_RED
    G1 X175 Y175 Z15 F9000                    # Goes to center of the bed
    M190 S{target_bed}                                  # Sets the target temp for the bed
    SET_DISPLAY_TEXT MSG="Soak for 30 seconds..."                # Displays info
    G4 P30000                                        # Waits 30 seconds for the bedtemp to stabilize
  {% endif %}

  SET_DISPLAY_TEXT MSG="Performing QGL..."     # Displays info
  LCD_CYAN
  QUAD_GANTRY_LEVEL                   # Levels the buildplate via QGL
  G28
  
  # Heating nozzle to 150 degrees. This helps with getting a correct Z-home
  SET_DISPLAY_TEXT MSG="Heating nozzle for cleaning and tapping."          # Displays info
  LCD_YELLOW
  M109 S150                                    # Heats the nozzle to 150c

  SET_DISPLAY_TEXT MSG="Performing cleaning and tap..." 
  LCD_PURPLE
  CLEAN_NOZZLE # Clean nozzle in order to prep for tapping
  G1 X175 Y175 Z15 F9000
  TAP # Perform tapping for final z-homing

  SET_DISPLAY_TEXT MSG="Creating mesh..."
  LCD_CYAN
  BED_MESH_CALIBRATE


  # Heats up the nozzle up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Heating nozzle."
  LCD_RED             # Displays info
  #STATUS_HEATING
  G1 X175 Y175 Z15 F9000                              # Goes to center of the bed
  M107                                                # Turns off partcooling fan
  M109 S{target_extruder}                             # Heats the nozzle to printing temp

